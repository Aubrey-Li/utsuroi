<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1f2a52" />
    <meta name="description" content="A journal for the words you don't need to keep." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Utsuroi</title>
  </head>
  <body>
    <section id="home" class="page home" hidden></section>
    <section id="calendar" class="page calendar" hidden></section>

    <section id="ocean" class="page ocean" hidden>
      <canvas aria-label="A beach at dusk. Draw in the sand; the waves come and go."></canvas>
      <div class="hud">
        <header class="brand">
          <span class="brand-name">utsuroi</span>
          <span class="brand-jp" lang="ja">移ろい</span>
        </header>

        <button class="leave" type="button" data-leave>Leave</button>
        <button class="sound" type="button" data-sound aria-pressed="true" aria-label="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /><path class="cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5" /></svg>
        </button>

        <div class="dock">
          <p class="hint" aria-live="polite" data-hint></p>
        </div>


        <div class="veil" data-veil></div>
      </div>
    </section>

    <section id="wind" class="page scene wind-scene" hidden>
      <canvas aria-label="A meadow under a tree on a sunny day. Your words float in the air."></canvas>
      <div class="hud">
        <header class="brand">
          <span class="brand-name">utsuroi</span>
          <span class="brand-jp" lang="ja">移ろい</span>
        </header>

        <button class="leave" type="button" data-leave>Leave</button>
        <button class="sound" type="button" data-sound aria-pressed="true" aria-label="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /><path class="cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5" /></svg>
        </button>

        <div class="dock">
          <p class="hint" aria-live="polite" data-hint></p>
          <button class="action" type="button" data-action disabled>Let the wind take it</button>
        </div>


        <textarea class="typed-sink" aria-label="Write here" autocapitalize="sentences" autocomplete="off" spellcheck="false" rows="1"></textarea>
        <div class="veil" data-veil></div>
      </div>
    </section>

    <section id="fire" class="page scene fire-scene" hidden>
      <canvas aria-label="A dark room. A blank page lies on a desk beside a candle."></canvas>
      <div class="hud">
        <header class="brand">
          <span class="brand-name">utsuroi</span>
          <span class="brand-jp" lang="ja">移ろい</span>
        </header>

        <button class="leave" type="button" data-leave>Leave</button>
        <button class="sound" type="button" data-sound aria-pressed="true" aria-label="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /><path class="cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5" /></svg>
        </button>

        <div class="dock">
          <p class="hint" aria-live="polite" data-hint></p>
          <button class="action" type="button" data-action disabled>Light it</button>
        </div>


        <textarea class="typed-sink" aria-label="Write here" autocapitalize="sentences" autocomplete="off" spellcheck="false" rows="1"></textarea>
        <div class="veil" data-veil></div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
